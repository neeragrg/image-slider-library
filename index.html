
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive image slider built with vanilla JavaScript">
    <title>Responsive Image Slider Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">Vanilla JavaScript Project</p>
            <h1>Image Slider Library</h1>
            <p class="intro">
                Explore a responsive image slider with smooth transitions,
                interactive navigation, and infinite looping.
            </p>
        </header>

        <section class="slider" data-slider aria-label="Image slider">
            <div class="slider__viewport">
                <div class="slider__track" data-track>

                    <figure class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85"
                            alt="Mountain landscape reflected in a lake">
                        <figcaption class="slide__caption">
                            <span>01 / Nature</span>
                            <strong>Find Your Horizon</strong>
                        </figcaption>
                    </figure>

                    <figure class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85"
                            alt="Beautiful open landscape surrounded by hills">
                        <figcaption class="slide__caption">
                            <span>02 / Adventure</span>
                            <strong>Explore the Unknown</strong>
                        </figcaption>
                    </figure>

                    <figure class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1600&q=85"
                            alt="Ocean waves moving toward the shore">
                        <figcaption class="slide__caption">
                            <span>03 / Ocean</span>
                            <strong>Find Your Calm</strong>
                        </figcaption>
                    </figure>

                    <figure class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85"
                            alt="Sunlight shining through a green forest">
                        <figcaption class="slide__caption">
                            <span>04 / Forest</span>
                            <strong>Reconnect with Nature</strong>
                        </figcaption>
                    </figure>

                </div>

                <button
                    class="slider__arrow slider__arrow--previous"
                    type="button"
                    data-previous
                    aria-label="Previous slide">
                    &#10094;
                </button>

                <button
                    class="slider__arrow slider__arrow--next"
                    type="button"
                    data-next
                    aria-label="Next slide">
                    &#10095;
                </button>

                <p class="slider__status" data-status aria-live="polite">
                    Slide 1 of 4
                </p>
            </div>

            <div class="slider__footer">
                <div class="slider__dots"
                     data-dots
                     role="group"
                     aria-label="Choose a slide">
                </div>
                <p class="slider__hint">Select a dot or use the arrows</p>
            </div>
        </section>

        <footer class="page-footer">
            Built with HTML, CSS, and vanilla JavaScript.
        </footer>
    </main>
</body>
</html>
